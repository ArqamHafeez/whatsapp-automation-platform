services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whatsapp_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d whatsapp_platform']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_API_PORT: 3000
    ports:
    - "8081:3000"  
    volumes:
      - waha_data:/app/.sessions
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ${DOCKERHUB_USER:-local}/whatsapp-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_platform?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      WAHA_API_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      RECONCILIATION_POLL_ENABLED: ${RECONCILIATION_POLL_ENABLED:-true}
      DELIVERY_MAX_PER_MINUTE: ${DELIVERY_MAX_PER_MINUTE:-30}
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    image: ${DOCKERHUB_USER:-local}/whatsapp-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://api:3000
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '3040:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  ollama:
    profiles: ['ollama']
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  waha_data:
  ollama_data:
